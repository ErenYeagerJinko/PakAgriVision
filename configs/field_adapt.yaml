# PakAgriVision Field Adaptation Configuration (Method 2: Strong Field Augmentation)
# Fine-tunes baseline ResNet-50 with rich stochastic outdoor transformations to maximize field generalization.
model:
  backbone: "resnet50"
  num_classes: 38
  dropout: 0.4
  pretrained: false
  init_checkpoint: "runs/baseline/best.pt"

data:
  splits_dir: "splits"
  train_split: "splits/field_adapt.csv"
  val_split: "splits/field_test.csv"
  test_split: "splits/field_test.csv"
  img_size: 224
  batch_size: 16
  num_workers: 0
  use_class_weights: false
  use_field_aug: true
  subset_frac: 1.0

training:
  seed: 42
  epochs: 30
  warmup_epochs: 0
  lr: 0.00003
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  label_smoothing: 0.1
  mixed_precision: true
  grad_clip_norm: 1.0
  early_stopping_patience: 12
  early_stopping_metric: "val_macro_f1"

logging:
  run_dir: "runs/field_adapt"
  results_dir: "results/field_adapt"
  reports_figures_dir: "reports/figures"
  save_checkpoint_every_epoch: true
