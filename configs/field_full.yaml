# PakAgriVision Full-Scale Field Adaptation Configuration (Method 1)
# Fine-tunes baseline ResNet-50 on the full official PlantDoc training set (~2,000 real-world field images).
model:
  backbone: "resnet50"
  num_classes: 38
  dropout: 0.35
  pretrained: false
  init_checkpoint: "runs/baseline/best.pt"

data:
  splits_dir: "splits"
  train_split: "splits/field_full_train.csv"
  val_split: "splits/field_test.csv"
  test_split: "splits/field_test.csv"
  img_size: 224
  batch_size: 32
  num_workers: 2
  use_class_weights: false
  use_field_aug: true
  subset_frac: 1.0

training:
  seed: 42
  epochs: 15
  warmup_epochs: 0
  lr: 0.00003
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  label_smoothing: 0.05
  mixed_precision: true
  grad_clip_norm: 1.0
  early_stopping_patience: 6
  early_stopping_metric: "val_macro_f1"

logging:
  run_dir: "runs/field_full"
  results_dir: "results/field_full"
  reports_figures_dir: "reports/figures"
  save_checkpoint_every_epoch: true
